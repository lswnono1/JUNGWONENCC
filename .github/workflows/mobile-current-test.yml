name: Verify Current Mobile Routes
on:
  push:
    branches: [fix/mobile-routing-v152]
    paths: [.github/workflows/mobile-current-test.yml]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: npm install --prefix /tmp/jlm-browser --no-save --ignore-scripts playwright@1.55.0
      - name: Verify public viewer and JSON body
        env:
          NODE_PATH: /tmp/jlm-browser/node_modules
        run: |
          mkdir -p probe
          node <<'JS'
          const {chromium,devices}=require('playwright'); const fs=require('fs'); const cp=require('child_process');
          (async()=>{
            const endpoints={
              current_R:'https://www.law.go.kr/LSW/lsInfoR.do?lsiSeq=286989&chrClsCd=010202&urlMode=lsInfoP&mobile=Y&hybridYn=Y',
              current_P:'https://www.law.go.kr/LSW/lsInfoP.do?lsiSeq=286989&mobile=Y',
              admin_R:'https://www.law.go.kr/LSW/admRulInfoR.do?admRulSeq=62505&chrClsCd=010202&mobile=Y&hybridYn=Y',
              json:'https://www.law.go.kr/DRF/lawService.do?OC=test&target=law&ID=1747&type=JSON',
              admin_json:'https://www.law.go.kr/DRF/lawService.do?OC=test&target=admrul&ID=62505&type=JSON'
            };
            for(const [name,url] of Object.entries(endpoints)){
              const body=cp.spawnSync('curl',['-4','-L','-sS','--connect-timeout','5','--max-time','12','-H','Origin: https://lswnono1.github.io','-D','probe/'+name+'.headers',url],{encoding:'utf8',maxBuffer:4e6}).stdout||'';
              fs.writeFileSync('probe/'+name+'.html',body);
              console.log('FETCH',name,body.length,body.slice(0,2000));
              console.log('HEADERS',name,fs.readFileSync('probe/'+name+'.headers','utf8'));
            }
            const browser=await chromium.launch({executablePath:'/usr/bin/google-chrome',args:['--no-sandbox']});
            const context=await browser.newContext({...devices['Pixel 7']});
            const results=[];
            for(const [name,url] of Object.entries(endpoints).filter(([k])=>!k.includes('json'))){
              const page=await context.newPage(); page.on('dialog',d=>d.dismiss());
              let error='';
              try{await page.goto(url,{timeout:15000,waitUntil:'domcontentloaded'});await page.waitForTimeout(2500); await page.screenshot({path:'probe/'+name+'.png'});}catch(e){error=e.message;}
              const result={name,url:page.url(),text:(await page.locator('body').innerText({timeout:1000}).catch(()=>'' )).slice(0,700),viewport:await page.locator('meta[name=viewport]').getAttribute('content',{timeout:1000}).catch(()=>''),error};
              console.log('BROWSER',JSON.stringify(result));results.push(result);await page.close();
            }
            const page=await context.newPage();await page.goto('https://lswnono1.github.io/JUNGWONENCC/lawmonitor/',{waitUntil:'domcontentloaded',timeout:15000});
            for(const name of ['json','admin_json']){
              const r=await page.evaluate(async url=>{try{const response=await fetch(url,{signal:AbortSignal.timeout(12000)});const text=await response.text();return{ok:response.ok,status:response.status,bytes:text.length,text:text.slice(0,1000)}}catch(e){return{error:e.message}}},endpoints[name]);console.log('CORS_BROWSER',name,JSON.stringify(r));results.push({name:'CORS_'+name,...r});
            }
            fs.writeFileSync('probe/results.json',JSON.stringify(results,null,2));await browser.close();
          })().catch(e=>{console.error(e);process.exitCode=1});
          JS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: current-mobile-test
          path: probe/
          retention-days: 3
