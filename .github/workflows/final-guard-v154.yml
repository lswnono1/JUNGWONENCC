name: Final parent-identity guard v154
on:
  push:
    branches: [fix/mobile-network-v154]
    paths: [.github/workflows/final-guard-v154.yml]
permissions:
  contents: write
defaults:
  run:
    shell: bash
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - name: Inspect official appendix parent metadata and apply bounded guards
        run: |
          set -euo pipefail
          mkdir -p test-output
          python3 - <<'PY'
          import json, subprocess
          from pathlib import Path
          u='https://www.law.go.kr/DRF/lawSearch.do?OC=test&target=licbyl&type=JSON&search=2&query=%EA%B1%B4%EC%B6%95%EB%B2%95&display=3&page=1'
          p=subprocess.run(['curl','-4','--fail','--silent','--show-error','--connect-timeout','8','--max-time','30',u],capture_output=True,text=True)
          if p.returncode==0:
              try:
                  obj=json.loads(p.stdout); Path('test-output/appendix-parent-sample.json').write_text(json.dumps(obj,ensure_ascii=False,indent=2)); print(p.stdout[:6000])
              except ValueError: print('Appendix probe did not return JSON')
          else: print('Appendix probe transport failure; independent tests retain original result')
          p=Path('lawmonitor/app-core-6.txt');s=p.read_text()
          old="    for (const record of records) {\n      const title = first(record,'별표명','별표서식명','별표서식제목','별표제목');"
          new="    for (const record of records) {\n      if (!v154AppendixParentMatches(record,item)) continue;\n      const title = first(record,'별표명','별표서식명','별표서식제목','별표제목');"
          assert s.count(old)==1;s=s.replace(old,new)
          old="normalizeDate(first(record,'공포일자','발령일자','개정일자','시행일자','효력일자'))"
          new="normalizeDate(first(record,'관련법령공포일자','관련행정규칙발령일자','공포일자','발령일자','개정일자'))"
          assert s.count(old)==1;s=s.replace(old,new)
          s=s.replace("    if ((page > 1 && added === 0) || records.length < 100) break;", "    if (page * 100 >= result.total) break;\n    if (!records.length || page === 30) throw v154Error('APPENDIX_INCOMPLETE','별표 목록의 전체 페이지를 확인하지 못했습니다.');")
          p.write_text(s)
          p=Path('lawmonitor/app-core-9.txt');s=p.read_text();old='spec.enforcementDate !== doc.enforcementDate';assert s.count(old)==1;s=s.replace(old,'v152Date(spec.enforcementDate) !== v152Date(doc.enforcementDate)');p.write_text(s)
          p=Path('lawmonitor/app-core-11.txt');s=p.read_text();s+='''
          function v154AppendixParentMatches(record,item) {
            const name=first(record,'법령명','법령명한글','관련법령명','행정규칙명','관련행정규칙명');
            if(name) return v154SameName(name,item.name);
            const parentId=first(record,'관련법령ID','법령ID');
            if(item.kind!=='행정규칙' && parentId && item.lawId) return v152EqualId(parentId,item.lawId);
            const parentSeq=first(record,'관련행정규칙일련번호','행정규칙일련번호');
            if(item.kind==='행정규칙' && parentSeq && item.adminId) return v152EqualId(parentSeq,item.adminId);
            throw v154Error('APPENDIX_IDENTITY','별표의 소속 법령을 확인하지 못했습니다. 다른 법령의 별표로 연결하지 않았습니다.');
          }
          ''';p.write_text(s)
          p=Path('tests/mobile-network.test.cjs');s=p.read_text();s+='''
          test('appendix names must match parent Act rather than prefix decree',()=>{const{c}=ctx(()=>res(''));assert.equal(c.v154AppendixParentMatches({법령명:'건축법 시행령'},{kind:'법령',name:'건축법'}),false);assert.equal(c.v154AppendixParentMatches({법령명:'건축법'},{kind:'법령',name:'건축법'}),true)});
          test('unidentified appendix is not assigned to requested parent law',()=>{const{c}=ctx(()=>res(''));assert.throws(()=>c.v154AppendixParentMatches({별표명:'시험'},{kind:'법령',name:'건축법',lawId:'001'}),e=>e.code==='APPENDIX_IDENTITY')});
          test('enforcement date comparison normalizes separator formats',()=>{const{c}=ctx(()=>res(''));assert.equal(c.v152Date('2026-09-18'),c.v152Date('20260918'));assert.match(src,/v152Date\\(spec.enforcementDate\\) !== v152Date\\(doc.enforcementDate\\)/)});
          ''';p.write_text(s)
          PY
          node scripts/build-mobile-release.cjs
          node --check lawmonitor/app-v1.5.4.js
          node --test tests/mobile-links.test.cjs tests/mobile-network.test.cjs | tee test-output/unit-v154-final.txt
      - name: Install browser and display support
        run: |
          set -euo pipefail
          npm install --prefix /tmp/jlm-browser --no-save --ignore-scripts playwright@1.55.0
          python3 -m pip install playwright==1.55.0
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends fonts-noto-cjk
      - name: Verify isolated mobile UI and both screenshot laws live
        env:
          NODE_PATH: /tmp/jlm-browser/node_modules
          CHROME_BIN: /usr/bin/google-chrome
        run: |
          set -euo pipefail
          python3 -u tests/mobile-recovery-browser.py | tee test-output/ui-final.txt
          python3 -c "import json;r=json.load(open('test-output/recovery-results.json'));assert r['passed'] and len(r['cases'])==7"
          python3 - <<'PY'
          from pathlib import Path
          import yaml
          doc=yaml.safe_load(Path('.github/workflows/verify-building-v154.yml').read_text())
          step=next(x for x in doc['jobs']['verify']['steps'] if 'Exercise exact history' in x.get('name',''))
          script=step['run'].split("node <<'JS'\n",1)[1].rsplit('\nJS',1)[0]
          Path('/tmp/check-building-v154.cjs').write_text(script)
          PY
          python3 -m http.server 8080 >/tmp/http.log 2>&1 &
          pid=$!
          trap 'kill $pid' EXIT
          sleep 1
          timeout 180 node /tmp/check-building-v154.cjs | tee test-output/building-live-final.txt
          python3 -c "import json;r=json.load(open('test-output/building-v154.json'));assert r['passed'] and all(x['body'] for x in r['rows'])"
      - name: Save tested generated files and evidence only to repair branch
        run: |
          set -euo pipefail
          cp test-output/building-v154.json diagnostics/building-v154-final.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lawmonitor tests/mobile-network.test.cjs diagnostics/building-v154-final.json
          git commit -m 'fix: validated appendix parent filtering and consistent date comparison v1.5.4'
          git push origin HEAD:fix/mobile-network-v154
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mobile-network-v154-final-evidence
          path: |
            lawmonitor/
            tests/
            scripts/build-mobile-release.cjs
            test-output/
          retention-days: 7
