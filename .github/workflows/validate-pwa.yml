name: Validate PWA
on:
  push:
    branches: [main]
    paths: ['lawmonitor/**', 'tests/**', 'scripts/**', '.github/workflows/validate-pwa.yml']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
defaults:
  run:
    shell: bash
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - name: Verify immutable bundle integrity and regression tests
        run: |
          set -euo pipefail
          mkdir -p test-output
          node --check lawmonitor/app-v1.5.3.js
          node --check lawmonitor/app.js
          node --check lawmonitor/sw.js
          node -e "const fs=require('fs'),crypto=require('crypto'),r=JSON.parse(fs.readFileSync('lawmonitor/release.json'));if(crypto.createHash('sha256').update(fs.readFileSync('lawmonitor/'+r.bundle)).digest('hex')!==r.sha256)throw Error('Bundle integrity failure')"
          node --test tests/mobile-links.test.cjs | tee test-output/unit-tests.txt
      - name: Install mobile test drivers and Korean fonts
        run: |
          set -euo pipefail
          npm install --prefix /tmp/jlm-browser --no-save --ignore-scripts playwright@1.55.0
          python3 -m pip install playwright==1.55.0
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends fonts-noto-cjk
      - name: Test nonempty data preservation and legacy error handling
        env:
          CHROME_BIN: /usr/bin/google-chrome
        run: |
          set -euo pipefail
          python3 -m http.server 8080 >/tmp/http.log 2>&1 &
          pid=$!
          trap 'kill $pid' EXIT
          sleep 1
          python3 -u tests/mobile-recovery-browser.py | tee test-output/recovery-ui.txt
          python3 -c "import json; r=json.load(open('test-output/recovery-results.json')); assert r['passed'] is True and len(r['cases'])==6"
      - name: Test live official bodies
        env:
          NODE_PATH: /tmp/jlm-browser/node_modules
        run: |
          set -euo pipefail
          python3 -m http.server 8080 >/tmp/http-live.log 2>&1 &
          pid=$!
          trap 'kill $pid' EXIT
          sleep 1
          node tests/mobile-reader-browser.cjs | tee test-output/browser-tests.txt
          grep -q 'MOBILE_READER_BROWSER_PASS' test-output/browser-tests.txt
          test ! -f test-output/failure.txt
      - name: Verify deployed recovery entry and runtime
        if: github.ref == 'refs/heads/main'
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json, os, pathlib, subprocess, time
          base='https://lswnono1.github.io/JUNGWONENCC/lawmonitor/'
          results=[]
          for name in ('app.js','app-v1.5.3.js','app-core-10.txt','sw.js','index.html','recover-v1.5.3.html','release.json'):
              expected=pathlib.Path('lawmonitor',name).read_bytes()
              for attempt in range(8):
                  url=base+name+'?verify='+os.environ['GITHUB_SHA']+'&attempt='+str(attempt)
                  response=subprocess.run(['curl','-4','--fail','--silent','--show-error','--connect-timeout','6','--max-time','15',url],capture_output=True)
                  if response.returncode==0 and response.stdout==expected:
                      results.append({'file':name,'match':True,'sha256':hashlib.sha256(expected).hexdigest()})
                      break
                  time.sleep(5)
              else:
                  raise RuntimeError('Deployed content mismatch: '+name)
          output={'commit':os.environ['GITHUB_SHA'],'base':base,'results':results}
          pathlib.Path('test-output/deployment-verification.json').write_text(json.dumps(output,indent=2))
          print(json.dumps(output,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mobile-recovery-v153-validation
          path: |
            test-output/
            lawmonitor/
            tests/
            scripts/
            MOBILE_RECOVERY_v1_5_3.md
          retention-days: 7
