name: Validate PWA
on:
  push:
    branches: [main, fix/mobile-routing-v152]
    paths: ['lawmonitor/**', 'tests/**', '.github/workflows/validate-pwa.yml']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - name: Validate syntax and actual combined overrides
        run: |
          node --check lawmonitor/app.js
          cat lawmonitor/app-core-{1..9}.txt > /tmp/app-core.js
          node --check /tmp/app-core.js
          node --check lawmonitor/sw.js
          node -e "JSON.parse(require('fs').readFileSync('lawmonitor/manifest.webmanifest','utf8'))"
          node --test tests/mobile-links.test.cjs
      - name: Install mobile browser test driver
        run: npm install --prefix /tmp/jlm-browser --no-save --ignore-scripts playwright@1.55.0
      - name: Test live official bodies in mobile Chromium
        env:
          NODE_PATH: /tmp/jlm-browser/node_modules
        run: |
          python3 -m http.server 8080 >/tmp/http.log 2>&1 &
          pid=$!
          trap 'kill $pid' EXIT
          sleep 1
          node tests/mobile-reader-browser.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mobile-reader-validation
          path: |
            test-output/
            lawmonitor/
            tests/
          retention-days: 7
